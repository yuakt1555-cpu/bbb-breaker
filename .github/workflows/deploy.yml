# GitHub Pages 自動デプロイ
#
# 【注意】github-pages 環境には既定でブランチ保護（デフォルトブランチのみデプロイ可）が
# かかることがあり、作業ブランチ（claude/vibrant-archimedes-d9m1ej）からの deploy が拒否される場合がある。
# 対処: Settings → Environments → github-pages → Deployment branches and tags に
#       作業ブランチを追加する、または main にマージして main から公開する。
# また Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vibrant-archimedes-d9m1ej
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
